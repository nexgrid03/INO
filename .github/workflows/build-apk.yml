name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "share-frontend/**"
      - "supabase/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Flutter Version
        id: flutter_version
        run: echo "version=$(cat .flutter-version | tr -d '\r\n ')" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: Verify Flutter Version
        run: bash tool/verify_flutter_version.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (Obfuscated)
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/INO-v${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: INO-apk
          path: dist/*.apk
          retention-days: 30

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-info/*
          retention-days: 90

      - name: Check Release Signing
        id: check_signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] || [ "${{ secrets.KEYSTORE_PASSWORD }}" != "" ]; then
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping public apk-latest release: Production signing credentials not present. APK is archived in workflow artifacts."
          fi

      - name: Create/update GitHub Release
        if: steps.check_signing.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: INO Android APK
          body: |
            Install on your phone:

            1. Open the **INO-v${{ github.run_number }}.apk** asset below on your phone
            2. Allow install from unknown sources if prompted
            3. Install

            Built from `${{ github.sha }}` (run #${{ github.run_number }}).
            Debug-signed CI build — fine for testing; not for Play Store.
          files: dist/*.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

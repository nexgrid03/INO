name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "share-frontend/**"
      - "supabase/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ".flutter-version"
          cache: true

      - name: Verify Flutter Version
        run: |
          REQUIRED_VERSION=$(cat .flutter-version | tr -d '\r\n ')
          INSTALLED_VERSION=$(flutter --version | head -n 1 | awk '{print $2}')
          echo "Required Flutter version: $REQUIRED_VERSION"
          echo "Installed Flutter version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "$REQUIRED_VERSION" ]; then
            echo "ERROR: Flutter version mismatch! Expected $REQUIRED_VERSION but found $INSTALLED_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (Obfuscated)
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/INO-v${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: INO-apk
          path: dist/*.apk
          retention-days: 30

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-info/*
          retention-days: 90

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: INO Android APK
          body: |
            Install on your phone:

            1. Open the **INO-v${{ github.run_number }}.apk** asset below on your phone
            2. Allow install from unknown sources if prompted
            3. Install

            Built from `${{ github.sha }}` (run #${{ github.run_number }}).
            Debug-signed CI build — fine for testing; not for Play Store.
          files: dist/*.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
